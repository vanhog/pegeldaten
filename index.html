<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Hydrological Infrastructure Intelligence Dashboard - Training Project
    </title>
    <link rel="stylesheet" href="./styles/styles.css" />
  </head>
  <body class="hiid-body">
    <main class="flex flex-col justify-center items-center">
      <div
        id="centered-box"
        class="flex flex-col justify-center items-center my-5"
      >
        <div id="grid-controller" class="flex flex-row flex-wrap gap-3">
          <div id="left-hand-side" class="flex flex-col gap-1">
            <section class="hiid-header">
              <h1 class="text-2xl text-white font-bold">Gauge Stations</h1>
            </section>
            <section id="listControl" class="hiid-list-control">
              <fieldset
                class="flex flex-row flex-wrap justify-start items-center"
              >
                <div id="searchField" class="flex flex-row">
                  <label for="searchTerm" class="sr-only">Search</label>
                  <img
                    src="./assets/magnifying.svg"
                    class="w-8 inline me-5"
                    alt="Icon of a magnifying glass"
                  />
                  <input
                    type="text"
                    id="searchTerm"
                    size="30%"
                    class="bg-hiid-bg px-3 text-hiid-text-glow rounded-xl text-base"
                    placeholder="NUM/NAME/WATER"
                  />
                  <button
                    type="button"
                    id="searchButton"
                    class="mx-5 p-1 bg-hiid-bg border border-hiid-bg text-hiid-text-glow rounded-xl inline hover:bg-gray-600 hover:text-gray-200 hover:border-hiid-text-glow active:scale-98"
                  >
                    Search
                  </button>
                </div>
                <!--
                <div id="radios" class="flex flex-row py-6">
                  <label for="up">
                    <input
                      type="radio"
                      name="searchGroup"
                      id="up"
                      class="ms-4 me-1"
                    />
                    <span class="text-lg">YEAR UP</span></label
                  >
                  <label for="down">
                    <input
                      type="radio"
                      name="searchGroup"
                      id="down"
                      class="ms-4 me-1"
                    />
                    <span class="text-lg">YEAR DOWN</span></label
                  >

                  <label for="rate">
                    <input
                      type="radio"
                      name="searchGroup"
                      id="rate"
                      class="ms-4 me-1"
                    />
                    <span class="text-lg">BEST RATED</span></label
                  >
                </div>
                -->
              </fieldset>
            </section>
            <section
              id="movieList"
              class="h-200 overflow-y-scroll rounded-b-2xl"
            ></section>
          </div>
          <div id="right-hand-side" class="flex flex-col gap-2">
            <section id="mapControl" class="hiid-drawer">
              <div
                id="station-title-admin-shortname"
                class="text-2xl text-white font-bold"
              >
                Station name
              </div>
              <div
                id="station-title-name"
                class="flex flex-row justify-between items-baseline"
              >
                <span id="station-title-admin-longname">number</span
                ><span id="station-title-admin-water">agency</span>
              </div>

              <div
                id="station-title-admin-meta"
                class="flex flex-row justify-between gap-3"
              >
                <span id="station-title-admin-number">number</span
                ><span id="station-title-admin-agency">agency</span>
              </div>
            </section>
            <!-- SECOND DRAWER-->
            <section id="statControl" class="hiid-drawer">
              <div
                id="current-measurement-title"
                class="text-2xl text-white font-bold"
              >
                Current Measurement
              </div>
              <div
                id="cmv"
                class="flex flex-row justify-center items-baseline gap-4"
              >
                <div
                  id="current-measurement-value"
                  class="text-7xl text-center text-hiid-text-glow py-8"
                >
                  0.00
                </div>
                <span id="current-measurement-unit" class="text-4xl"
                  >epiglül</span
                >
              </div>
            </section>
            <section id="metaControl" class="hiid-drawer">asdfsadf</section>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
