<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gauge Stations - Training Project</title>
    <link rel="stylesheet" href="./styles/styles.css" />
  </head>
  <body class="bg-amber-200 w-full">
    <header>
      <h1 class="text-9xl ps-5">Gauge Stations</h1>
      <hr class="mt-3 h-full" />
    </header>
    <main class="w-full">
      <section id="mapControl" class="bg-green-400">asdfsadf</section>
      <section id="viewControl" class="ps-5 py-4 bg-blue-300">
        <fieldset
          class="flex flex-row flex-wrap justify-start items-center w-full"
        >
          <div id="searchField" class="flex flex-row">
            <label for="searchTerm" class="sr-only">Search</label>
            <img
              src="./assets/magnifying.svg"
              class="w-15 inline me-5"
              alt="Icon of a magnifying glass"
            />
            <input
              type="text"
              id="searchTerm"
              size="30%"
              class="bg-white p-3 rounded-xl text-lg"
              placeholder="Name/Director/Year"
            />
            <button
              type="button"
              id="searchButton"
              class="mx-5 p-3 bg-gray-300 border border-black rounded-xl inline hover:bg-gray-600 hover:text-gray-200 hover:border-gray-200 active:scale-98"
            >
              Search
            </button>
          </div>

          <div id="radios" class="flex flex-row py-6">
            <label for="up">
              <input
                type="radio"
                name="searchGroup"
                id="up"
                class="ms-4 me-1"
              />
              <span class="text-lg">YEAR UP</span></label
            >
            <label for="down">
              <input
                type="radio"
                name="searchGroup"
                id="down"
                class="ms-4 me-1"
              />
              <span class="text-lg">YEAR DOWN</span></label
            >

            <label for="rate">
              <input
                type="radio"
                name="searchGroup"
                id="rate"
                class="ms-4 me-1"
              />
              <span class="text-lg">BEST RATED</span></label
            >
          </div>
        </fieldset>
      </section>
      <hr class="m-0" />
      <section id="movieList"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
