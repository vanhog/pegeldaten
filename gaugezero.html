<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gaugzerotest</title>
    <link rel="stylesheet" href="./styles/styles.css" />
  </head>
  <body>
    <main>
      <section id="data"></section>
      <!-- SECOND DRAWER-->
      <section id="statControl" class="hiid-drawer">
        <div
          id="current-measurement-title"
          class="text-2xl text-white font-bold"
        >
          Current Measurement
        </div>
        <div
          id="cmv"
          class="flex flex-row justify-center items-baseline gap-4 bg-red-400"
        >
          <div
            class="flex flex-row justify-between items-end w-[60%] bg-amber-400"
          >
            <div class="flex flex-col justify-end items-end border-1">
              <div>left</div>
              <div>left unit</div>
            </div>

            <div
              class="flex flex-row justify-center items-baseline border-1 bg-green-300"
            >
              <div
                id="current-measurement-value"
                class="text-7xl text-center text-hiid-text-glow"
              >
                ---
              </div>
              <div id="current-measurement-unit" class="text-4xl"></div>
            </div>

            <div class="flex flex-col justify-end items-start border-1">
              <div>right</div>
              <div>right unit</div>
            </div>
          </div>
        </div>
        <div id="cmv-timestamp" class="current-measurement-time">Time/Date</div>
      </section>
    </main>
  </body>
  <script type="module" src="./src/gaugezerotester.js"></script>
</html>
